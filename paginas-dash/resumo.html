<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo</title>
    <link rel="stylesheet" href="../estilo/style.css">
    <style>
        table {
            display: block;
            margin-top: 50px;
            width: 1000px;
            height: 400px;
            border-collapse: collapse;
        }

        table caption {
            position: sty;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
            font-weight: 900;
            text-align: left;
            padding: 20px;
        }

        table th {
            color: #808080;
            border: 1px solid #808080;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 15px;
        }

        table td {
            color: #000000;
            border: 1px solid #808080;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header class="cabecalho-resumo">
        <h1>Bem-Vindo, Henrique!</h1>

        <nav class="navegacao-resumo">
            <a href="">Visão geral diária</a>
            <a href="">Padrão</a>
        </nav>
    </header>

    <main>
        <table>
            <caption>Seus Rendimentos</caption>
            <thead>
                <tr>
                    <th>Cliques promocionais</th>
                    <th>Visitantes do formulário de pedido</th>
                    <th>Conversões</th>
                    <th>Taxa de conversão</th>
                    <th>EPC</th>
                    <th>Bruto</th>
                    <th>Devoluções</th>
                    <th>Comissões</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2.500</td>
                    <td>1.100</td>
                    <td>1.000</td>
                    <td>40%</td>
                    <td>US$400</td>
                    <td>US$3.000</td>
                    <td>25%</td>
                    <td>US$5.000</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
